<!doctype html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>படத்தைப் பார்ப்போம்! சொற்களைக் கண்டுபிடிப்போம்!</title><style>body{margin:0;background:#f3f8ff;font-family:Arial,'Noto Sans Tamil',sans-serif;color:#17324d}.wrap{max-width:1200px;margin:auto;padding:16px}h1{text-align:center;font-size:clamp(21px,3vw,34px);margin:8px 0}.sub{text-align:center;margin:0 0 12px;font-size:18px}.scene{position:relative;line-height:0;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #243c5a30}.scene img{width:100%;display:block}.spot{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer;width:13%;height:18%;border-radius:50%;}.spot:focus-visible{outline:4px solid #ffde54}.word{position:absolute;transform:translate(-50%,-120%);padding:9px 17px;border:3px solid #ef476f;border-radius:12px;background:white;font-size:clamp(15px,2.1vw,27px);font-weight:bold;line-height:1.4;box-shadow:0 3px 8px #0003;white-space:nowrap;pointer-events:none}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:14px}button.reset{font-size:17px;border:0;background:#155e95;color:white;padding:11px 20px;border-radius:12px;cursor:pointer}.hint{text-align:center;color:#486277;margin-top:12px} .count{text-align:center;font-weight:bold;margin-top:10px}</style></head><body><main class="wrap"><h1>படத்தைப் பார்ப்போம்! சொற்களைக் கண்டுபிடிப்போம்!</h1><p class="sub">படத்தை உற்றுநோக்குங்கள். தெரிந்த சொற்களைக் கூறுங்கள். ஆசிரியர் படத்தில் சொடுக்கிச் சொல்லை வெளிப்படுத்துவார்.</p><div class="scene" id="scene"><img alt="ராமுவும் ரவியும் பூங்காவில் விளையாடும் வண்ணப்படம்" src="park.png"></div><p class="count" id="count">வெளிப்படுத்திய சொற்கள்: 0 / 4</p><div class="controls"><button class="reset" id="reset">↻ மீண்டும் தொடங்கு</button></div><p class="hint">மாணவர்கள் முதலில் சொல்லைக் கூறட்டும். பின்னர் படத்தில் உள்ள பொருளைச் சொடுக்குங்கள்.</p></main><script>const items=[{name:'பூங்கா',x:14,y:23},{name:'ஊஞ்சல்',x:77,y:51},{name:'பந்து',x:50,y:72},{name:'மிதிவண்டி',x:74,y:84}];const scene=document.getElementById('scene');const seen=new Set();items.forEach((item,i)=>{const b=document.createElement('button');b.className='spot';b.style.left=item.x+'%';b.style.top=item.y+'%';b.setAttribute('aria-label','சொல்லை வெளிப்படுத்து: '+item.name);b.title='சொல்லை வெளிப்படுத்து';b.onclick=()=>{if(seen.has(i))return;seen.add(i);const t=document.createElement('div');t.className='word';t.textContent=item.name;t.style.left=item.x+'%';t.style.top=item.y+'%';t.dataset.label=i;scene.appendChild(t);document.getElementById('count').textContent='வெளிப்படுத்திய சொற்கள்: '+seen.size+' / 4';};scene.appendChild(b)});document.getElementById('reset').onclick=()=>{seen.clear();document.querySelectorAll('.word').forEach(n=>n.remove());document.getElementById('count').textContent='வெளிப்படுத்திய சொற்கள்: 0 / 4';};</script></body></html>
